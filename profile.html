<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | TaskNet</title>
    <link rel="stylesheet" href="styles/login.css">
    <style>
        .profile-section { min-height: 68vh; padding: 70px 24px; display: flex; justify-content: center; align-items: flex-start; }
        .profile-card { width: 100%; max-width: 760px; background: #fff; border-radius: 22px; padding: 38px; box-shadow: 0 18px 55px rgba(25, 45, 90, .12); position: relative; z-index: 1; }
        .profile-top { display: flex; align-items: center; gap: 22px; padding-bottom: 28px; border-bottom: 1px solid #e8edf5; }
        .profile-avatar { width: 94px; height: 94px; flex: 0 0 94px; border-radius: 50%; display: flex; justify-content: center; align-items: center; background: linear-gradient(135deg, #1769e0, #75aaff); color: #fff; font-size: 36px; font-weight: 800; }
        .profile-eyebrow { color: #1769e0; font-size: 12px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; }
        .profile-name { margin: 7px 0 6px; color: #17233c; font-size: clamp(26px, 4vw, 34px); overflow-wrap: anywhere; }
        .profile-email { margin: 0; color: #6d7890; overflow-wrap: anywhere; }
        .rating-panel { margin-top: 26px; padding: 23px; border-radius: 15px; background: #f5f8ff; }
        .rating-panel h2 { margin: 0 0 10px; color: #17233c; font-size: 19px; }
        .rating-stars { color: #f4b400; font-size: 30px; letter-spacing: 4px; line-height: 1.5; }
        .rating-caption { margin: 5px 0 0; color: #66738c; font-size: 14px; }
        .profile-meta { margin-top: 22px; color: #66738c; font-size: 14px; }
        .profile-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 28px; }
        .profile-home, .profile-logout { min-height: 46px; border-radius: 10px; padding: 12px 20px; font: inherit; font-weight: 700; cursor: pointer; text-decoration: none; }
        .profile-home { display: inline-flex; align-items: center; background: #1769e0; color: #fff; }
        .profile-logout { border: 1px solid #d7dfeb; background: #fff; color: #263650; }
        @media (max-width: 560px) { .profile-section { padding: 38px 16px; } .profile-card { padding: 25px 20px; } .profile-top { align-items: flex-start; flex-direction: column; } }
    </style>
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo">Task<span>Net</span></a>
        <nav class="nav">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="services.html">Services</a>
            <a href="hire.html">Hire</a>
            <a href="contact.html">Contact</a>
        </nav>
        <form action="/logout" method="post" style="margin:0">
            <input type="hidden" name="csrf_token" value="__TASKNET_CSRF_TOKEN__">
            <button type="submit" class="header-signup" style="cursor:pointer">Log out</button>
        </form>
    </header>

    <main class="login-section profile-section">
        <div class="login-decoration decoration-one"></div>
        <div class="login-decoration decoration-two"></div>
        <section class="profile-card">
            <div class="profile-top">
                <div class="profile-avatar" aria-hidden="true">T</div>
                <div>
                    <span class="profile-eyebrow">TASKNET MEMBER</span>
                    <h1 class="profile-name">__TASKNET_USER_NAME__</h1>
                    <p class="profile-email">__TASKNET_USER_EMAIL__</p>
                </div>
            </div>

            <section class="rating-panel" aria-label="Profile rating">
                <h2>Star rating</h2>
                <div class="rating-stars" aria-label="Not rated yet">☆☆☆☆☆</div>
                <p class="rating-caption">New member · Not rated yet</p>
            </section>

            <p class="profile-meta">Member since: __TASKNET_MEMBER_SINCE__</p>
            <div class="profile-actions">
                <a class="profile-home" href="index.html">Explore TaskNet <span aria-hidden="true">&nbsp;→</span></a>
                <form action="/logout" method="post" style="margin:0">
                    <input type="hidden" name="csrf_token" value="__TASKNET_CSRF_TOKEN__">
                    <button class="profile-logout" type="submit">Log out</button>
                </form>
            </div>
        </section>
    </main>

    <footer class="footer">
        <a href="index.html" class="logo footer-logo">Task<span>Net</span></a>
        <p>Connecting people. Simplifying tasks.</p>
        <span class="copyright">&copy; 2026 TaskNet. All rights reserved.</span>
    </footer>
</body>
</html>
